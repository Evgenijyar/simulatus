<!doctype html>
<html lang="ru">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>Simulatus — Back Office</title>
    <link rel="stylesheet" href="/assets/backoffice.css?v=011">
</head>
<body>
<div class="shell">
    <header>
        <div class="brand">
            <img class="brand-logo" src="/assets/simulatus-logo.png" alt="Симулятус — ИИ-тренажёр продаж">
            <div class="brand-separator"></div>
            <div class="brand-caption"><b>BACK OFFICE</b><small>AI SALES TRAINING</small></div>
        </div>
        <div class="header-actions"><span id="global-status">Подключение…</span><button id="logout" class="btn ghost">Выйти</button></div>
    </header>
    <div class="layout">
        <aside>
            <button id="btn-add-user" class="btn primary wide">＋ Пользователь</button>
            <div class="side-title">Пользователи</div><div id="user-list" class="user-list"></div>
            <div class="side-title">Управление</div>
            <nav id="nav"><button data-view="overview" class="active">Обзор</button><button data-view="roles">Роли и промпты</button><button data-view="credentials">Gemini-ключи</button><button data-view="sessions">Тренировки</button><button data-view="system">Система</button><button data-view="audit">Журнал</button></nav>
        </aside>
        <main id="workspace"><div class="loading">Загрузка Simulatus…</div></main>
    </div>
</div>
<div id="modal-root"></div><div id="toast-root"></div><script src="/assets/backoffice.js?v=011"></script>
</body>
</html>
