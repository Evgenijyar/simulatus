spring.application.name=Simulatus Backend
server.port=8080
server.forward-headers-strategy=framework
server.servlet.session.cookie.name=SIMULATUS_ADMIN_SESSION
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax
server.servlet.session.cookie.secure=${SIMULATUS_SESSION_SECURE:false}
server.servlet.session.timeout=8h
server.shutdown=graceful
spring.lifecycle.timeout-per-shutdown-phase=20s
server.error.include-message=never

# Same PostgreSQL host/port as the supplied reference backend; use a separate DB/user in production.
spring.datasource.url=jdbc:postgresql://${SIMULATUS_DB_HOST:45.11.92.142}:${SIMULATUS_DB_PORT:5433}/${SIMULATUS_DB_NAME:simulatus}
spring.datasource.username=${SIMULATUS_DB_USER:simulatus_app}
spring.datasource.password=${SIMULATUS_DB_PASSWORD}
spring.datasource.hikari.maximum-pool-size=6
spring.datasource.hikari.minimum-idle=1
spring.datasource.hikari.connection-timeout=10000
spring.datasource.hikari.validation-timeout=3000
spring.datasource.hikari.keepalive-time=120000
spring.jpa.open-in-view=false
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
spring.flyway.enabled=true
spring.flyway.validate-on-migrate=true
spring.flyway.clean-disabled=true

trainer.admin.login=${SIMULATUS_ADMIN_LOGIN:admin}
trainer.admin.password=${SIMULATUS_ADMIN_PASSWORD}
trainer.crypto.master-key=${SIMULATUS_MASTER_KEY}
trainer.auth.access-token-minutes=30
trainer.auth.refresh-token-hours=24
trainer.auth.remember-refresh-token-days=7
trainer.live.lease-seconds=180
trainer.live.cleanup-delay-ms=30000
trainer.gemini.auth-token-url=https://generativelanguage.googleapis.com/v1beta/auth_tokens
trainer.gemini.websocket-url=wss://generativelanguage.googleapis.com/ws/google.ai.generativelanguage.v1beta.GenerativeService.BidiGenerateContentConstrained
trainer.gemini.default-live-model=gemini-3.1-flash-live-preview
trainer.gemini.default-evaluation-model=gemini-3.1-flash-lite
trainer.gemini.generate-url=https://generativelanguage.googleapis.com/v1beta/models/{model}:generateContent
trainer.gemini.token-expire-minutes=60
# newSessionExpireTime is intentionally omitted from AuthToken requests; Google applies its server-side 60s default.
trainer.gemini.http-timeout-seconds=30

management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=never
info.app.name=Simulatus Backend
info.app.version=0.1.0
logging.level.root=INFO
logging.level.ru.salestrainer.backend=INFO
logging.file.name=logs/simulatus-backend.log
logging.logback.rollingpolicy.max-file-size=20MB
logging.logback.rollingpolicy.max-history=10
